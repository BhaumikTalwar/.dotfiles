<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend">
      <string>Noto Sans</string>
      <string>Noto Sans Devanagari</string> <!-- Hindi -->
      <string>Noto Sans Gurmukhi</string> <!-- Punjabi -->
      <string>Noto Sans CJK JP</string> <!-- Japanese -->
      <string>Noto Sans Arabic</string> <!-- Arabic -->
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend">
      <string>Noto Serif</string>
      <string>Noto Serif Devanagari</string> <!-- Hindi -->
      <string>Noto Serif Gurmukhi</string> <!-- Punjabi -->
      <string>Noto Serif CJK JP</string> <!-- Japanese -->
      <string>Noto Serif Arabic</string> <!-- Arabic -->
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Mono</string>
      <string>Noto Sans Mono CJK JP</string> <!-- Japanese -->
      <string>Noto Sans Mono Arabic</string> <!-- Arabic -->
    </edit>
  </match>
</fontconfig>
