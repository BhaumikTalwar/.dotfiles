$base = 0xff1e1e2e
$text = 0xffcdd6f4
$rosewater = 0xfff5e0dc
$pink = 0xfff5c2e7
$mauve = 0xffcba6f7
$peach = 0xfffab387
$overlay0 = 0xff6c7086

general {
    gaps_in = 0
    gaps_out = 5
    border_size = 1
    col.active_border = $pink
    col.inactive_border = $mauve
    layout = master
}

decoration {
    rounding = 0
    blur {
        enabled = yes
        size = 7
        passes = 5
        vibrancy = 0.5
    }
}

animations {
    enabled = false
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = windows, 1, 2, ease
    animation = windowsOut, 1, 2, ease
    animation = fade, 1, 2, ease
    animation = workspaces, 1, 2, ease
}

xwayland {
    force_zero_scaling = true
}

monitor = HDMI-A-2,1280x720@60,auto,1
#monitor = *, adaptive_sync, 1

input {
    kb_layout = us
    kb_options = caps:escape
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        #tap_to_click = true
        middle_button_emulation = true
    }
}

$mod = SUPER
$left = h
$down = j
$up = k
$right = l
$term = ghostty
$menu = wofi --show drun -I -a
$browser = brave
$file_manager = ghostty

bind = $mod, x, exec, keepassxc
bind = $mod, d, exec, $menu
bind = $mod, w, exec, $browser
bind = $mod, r, exec, $file_manager
bind = $mod, Return, exec, $term
bind = $mod+Shift, Return, exec, kitty --class=termfloat
bind = $mod+Shift, e, exec, bemoji

bind = $mod, bracketleft, exec, grimshot --notify save area "~/Pictures/$(date '+%Y-%m-%d_no_watermark').png"
bind = $mod, bracketright, exec, grimshot --notify copy area
bind = $mod, a, exec, ~/.config/sway/grimshot_watermark.sh

bind = $mod+Shift, x, exec, hyprlock
bind = $mod+Shift, r, exec, hyprctl reload
bind = $mod, q, killactive
bind = $mod, b, exec, killall -SIGUSR1 waybar
bind = $mod+Shift, q, exec, hyprctl dispatch exit

bind = $mod, slash, workspace, previous
bind = $mod, period, workspace, +1
bind = $mod, comma, workspace, -1

bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE
exec-once = dbus-daemon --session --address=unix:path=$XDG_RUNTIME_DIR/bus
exec-once = mako
exec-once = fcitx5
exec-once = swaybg -i ~/.config/sway/Background/wall5.png
exec-once = nm-applet --indicator
exec-once = syncthing
exec-once = redshift -l 25.348766:55.405403
exec-once = ~/.config/waybar/launch_waybar.sh
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle -w timeout 1800 'systemctl suspend' before-sleep 'hyprlock'

windowrulev2 = float, class:^(mpv)$
windowrulev2 = size 960 540, class:^(mpv)$
windowrulev2 = float, class:^(keepassxc)$

bind = $mod, $left, movefocus, l
bind = $mod, $down, movefocus, d
bind = $mod, $up, movefocus, u
bind = $mod, $right, movefocus, r
bind = $mod, Left, movefocus, l
bind = $mod, Down, movefocus, d
bind = $mod, Up, movefocus, u
bind = $mod, Right, movefocus, r

bind = $mod+Shift, $left, movewindow, l
bind = $mod+Shift, $down, movewindow, d
bind = $mod+Shift, $up, movewindow, u
bind = $mod+Shift, $right, movewindow, r
bind = $mod+Shift, Left, movewindow, l
bind = $mod+Shift, Down, movewindow, d
bind = $mod+Shift, Up, movewindow, u
bind = $mod+Shift, Right, movewindow, r

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod+Shift, 1, movetoworkspace, 1
bind = $mod+Shift, 2, movetoworkspace, 2
bind = $mod+Shift, 3, movetoworkspace, 3
bind = $mod+Shift, 4, movetoworkspace, 4
bind = $mod+Shift, 5, movetoworkspace, 5
bind = $mod+Shift, 6, movetoworkspace, 6
bind = $mod+Shift, 7, movetoworkspace, 7
bind = $mod+Shift, 8, movetoworkspace, 8
bind = $mod+Shift, 9, movetoworkspace, 9
bind = $mod+Shift, 0, movetoworkspace, 10

# Optionally silent moves
bind = $mod+Ctrl, 1, movetoworkspacesilent, 1
bind = $mod+Ctrl, 2, movetoworkspacesilent, 2
bind = $mod+Ctrl, 3, movetoworkspacesilent, 3
bind = $mod+Ctrl, 4, movetoworkspacesilent, 4
bind = $mod+Ctrl, 5, movetoworkspacesilent, 5
bind = $mod+Ctrl, 6, movetoworkspacesilent, 6
bind = $mod+Ctrl, 7, movetoworkspacesilent, 7
bind = $mod+Ctrl, 8, movetoworkspacesilent, 8
bind = $mod+Ctrl, 9, movetoworkspacesilent, 9
bind = $mod+Ctrl, 0, movetoworkspacesilent, 10

